  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Hostliday Orbit · Design System<\u002Ftitle>\n<style>/* =========================================================\n   Hostliday Orbit — Design Tokens\n   colors_and_type.css\n   Single source of truth: color, type, spacing, radii,\n   shadows, motion, semantic vars.\n   ========================================================= */\n\n/* ---------- Webfonts ---------- */\n@font-face {\n  font-family: \"Inter\";\n  src: url(\"cda083fc-7ad7-4b58-8f6a-ed69e4b6f094\") format(\"woff2-variations\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Montserrat\";\n  src: url(\"6509fe25-da57-40e8-8052-588b1d6a4622\") format(\"woff2-variations\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"JetBrains Mono\";\n  src: url(\"0afa65bc-db60-4490-ab2f-9a1186610b0a\") format(\"woff2-variations\");\n  font-weight: 100 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* =========================================================\n   CORE TOKENS\n   ========================================================= */\n:root {\n  /* ---------- Brand red (from Brandbook) ---------- */\n  --hostliday-red:        #BE0000;   /* primary brand red */\n  --hostliday-red-deep:   #810000;   /* gradient end */\n  --hostliday-red-bright: #DA0000;   /* gradient start */\n  --hostliday-red-50:     #FBEAEA;\n  --hostliday-red-100:    #F4C7C7;\n  --hostliday-red-200:    #E89B9B;\n  --hostliday-red-300:    #D86161;\n  --hostliday-red-400:    #CC2929;\n  --hostliday-red-500:    #BE0000;\n  --hostliday-red-600:    #A30000;\n  --hostliday-red-700:    #810000;\n  --hostliday-red-800:    #5C0000;\n  --hostliday-red-900:    #3D0000;\n\n  /* The Hostliday Gradient — defined in two angles per brandbook */\n  --hostliday-gradient-120: linear-gradient(120deg, #DA0000 0%, #810000 100%);\n  --hostliday-gradient-90:  linear-gradient(90deg,  #DA0000 0%, #810000 100%);\n  --hostliday-gradient: var(--hostliday-gradient-120);\n\n  /* ---------- Neutrals (warm-leaning, brandbook-anchored) ---------- */\n  --neutral-0:    #FFFFFF;\n  --neutral-25:   #FDFCFB;\n  --neutral-50:   #FAF8F6;   /* off-white canvas */\n  --neutral-100:  #F4F1ED;   /* app shell canvas */\n  --neutral-150:  #ECE8E3;\n  --neutral-200:  #E1DFDD;   /* brandbook neutral */\n  --neutral-300:  #C9C6C2;\n  --neutral-400:  #A3A2A2;   /* brandbook neutral */\n  --neutral-500:  #807F7E;\n  --neutral-600:  #5E5D5C;\n  --neutral-700:  #3F3E3D;\n  --neutral-800:  #232221;\n  --neutral-900:  #0E0E0E;\n  --neutral-1000: #000000;   /* brandbook black */\n\n  /* ---------- Status (added for product) ---------- */\n  --status-confirmed:     #1F7A4D;  /* green: confirmed bookings */\n  --status-confirmed-bg:  #E5F2EC;\n  --status-held:          #B6822E;  /* amber: held / pending */\n  --status-held-bg:       #FAF1DF;\n  --status-live:          #2E5C8A;  /* slate-blue: in transit / live */\n  --status-live-bg:       #E5EEF7;\n  --status-critical:      var(--hostliday-red-500);\n  --status-critical-bg:   var(--hostliday-red-50);\n\n  /* ---------- Semantic colors (LIGHT) ---------- */\n  --bg-canvas:        var(--neutral-100);\n  --bg-surface:       var(--neutral-0);\n  --bg-surface-alt:   var(--neutral-50);\n  --bg-sunken:        var(--neutral-150);\n  --bg-inverse:       var(--neutral-1000);\n\n  --fg-1:             var(--neutral-1000);   /* primary text */\n  --fg-2:             var(--neutral-700);    /* secondary text */\n  --fg-3:             var(--neutral-500);    /* tertiary, captions */\n  --fg-4:             var(--neutral-400);    /* placeholder / disabled */\n  --fg-on-brand:      var(--neutral-0);\n  --fg-on-dark:       var(--neutral-0);\n  --fg-link:          var(--hostliday-red-700);\n\n  --border-1:         var(--neutral-200);\n  --border-2:         var(--neutral-300);\n  --border-strong:    var(--neutral-700);\n  --border-focus:     var(--hostliday-red-500);\n\n  --accent:           var(--hostliday-red-500);\n  --accent-hover:     var(--hostliday-red-600);\n  --accent-press:     var(--hostliday-red-700);\n\n  /* ---------- Surface gradients & overlays ---------- */\n  --protection-gradient: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.55) 100%);\n  --protection-gradient-strong: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.78) 100%);\n  --protection-gradient-top:    linear-gradient(180deg, rgba(0,0,0,.45) 0%, transparent 60%);\n\n  /* ---------- Type families ---------- */\n  --font-display: \"Montserrat\", ui-sans-serif, system-ui, sans-serif;\n  --font-body:    \"Inter\", ui-sans-serif, system-ui, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* ---------- Type scale (1.25 modular, +1 hero step) ---------- */\n  --fs-12: 12px;\n  --fs-13: 13px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-16: 16px;\n  --fs-18: 18px;\n  --fs-20: 20px;\n  --fs-24: 24px;\n  --fs-28: 28px;\n  --fs-32: 32px;\n  --fs-40: 40px;\n  --fs-48: 48px;\n  --fs-64: 64px;\n  --fs-80: 80px;\n  --fs-104: 104px;     /* hero numerals */\n\n  /* Line heights */\n  --lh-tight: 1.05;\n  --lh-snug:  1.18;\n  --lh-base:  1.5;\n  --lh-loose: 1.7;\n\n  /* Letter spacing */\n  --ls-tightest: -0.03em;\n  --ls-tighter:  -0.02em;\n  --ls-tight:    -0.01em;\n  --ls-normal:    0em;\n  --ls-wide:      0.04em;\n  --ls-widest:    0.12em;\n\n  /* Weights (Inter / Montserrat variable) */\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n  --fw-black:    900;\n\n  /* ---------- Spacing (4px base) ---------- */\n  --sp-0:  0;\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-14: 56px;\n  --sp-20: 80px;\n  --sp-30: 120px;\n\n  /* Page gutters */\n  --gutter-mobile:  16px;\n  --gutter-app:     24px;\n  --gutter-desktop: 80px;\n\n  /* ---------- Radii ---------- */\n  --r-chip:   4px;\n  --r-input:  8px;\n  --r-card:   12px;\n  --r-sheet:  20px;\n  --r-pill:   999px;\n\n  /* ---------- Shadows (light mode) ---------- */\n  --shadow-flat:   0 0 0 1px var(--border-1);\n  --shadow-card:   0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.10);\n  --shadow-pop:    0 8px 16px -4px rgba(0,0,0,.08), 0 24px 48px -16px rgba(0,0,0,.18);\n  --shadow-modal:  0 32px 64px -24px rgba(0,0,0,.30);\n  --shadow-focus:  0 0 0 3px rgba(190,0,0,.22);\n\n  /* ---------- Motion ---------- */\n  --ease-orbit: cubic-bezier(.2, .7, .2, 1);\n  --dur-micro:  140ms;\n  --dur-base:   220ms;\n  --dur-surface:360ms;\n  --dur-breathe:2400ms;\n\n  /* ---------- Layout sizes ---------- */\n  --topbar-h:    56px;\n  --bottomnav-h: 64px;\n  --sheet-peek:  96px;\n\n  /* ---------- Icons ---------- */\n  --icon-base:   \"https://unpkg.com/lucide-static@0.460.0/icons\";\n  --icon-sw-sm:  1.25;\n  --icon-sw-md:  1.5;\n  --icon-sw-lg:  1.75;\n}\n\n/* =========================================================\n   DARK MODE — used on Navigate (live map) and any panel that\n   floats over photography. Apply `.orbit-dark` to a container.\n   ========================================================= */\n.orbit-dark {\n  --bg-canvas:      #0E1117;\n  --bg-surface:     #15181F;\n  --bg-surface-alt: #1B1F27;\n  --bg-sunken:      #0A0C12;\n\n  --fg-1:           #F5F5F4;\n  --fg-2:           #BDBCBA;\n  --fg-3:           #8E8D8B;\n  --fg-4:           #5E5D5C;\n\n  --border-1:       rgba(255,255,255,.08);\n  --border-2:       rgba(255,255,255,.14);\n  --border-strong:  rgba(255,255,255,.40);\n\n  --shadow-card:    0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px -8px rgba(0,0,0,.55);\n  --shadow-pop:     0 16px 48px -8px rgba(0,0,0,.65);\n  --shadow-modal:   0 32px 80px -16px rgba(0,0,0,.75);\n\n  --status-confirmed-bg: rgba(31,122,77,.18);\n  --status-held-bg:      rgba(182,130,46,.20);\n  --status-live-bg:      rgba(46,92,138,.22);\n  --status-critical-bg:  rgba(190,0,0,.22);\n}\n\n/* Floating glass panel — for use over the map */\n.orbit-dark .glass,\n.glass {\n  background: rgba(20, 22, 28, .72);\n  backdrop-filter: blur(18px) saturate(1.1);\n  -webkit-backdrop-filter: blur(18px) saturate(1.1);\n  border: 1px solid rgba(255,255,255,.08);\n}\n\n/* =========================================================\n   SEMANTIC TYPOGRAPHY\n   Use these classes (or the matching CSS vars) directly.\n   ========================================================= */\n\n.t-hero-numeral,\n:where(.t-hero-numeral) {\n  font-family: var(--font-display);\n  font-weight: var(--fw-black);\n  font-size: clamp(72px, 8vw, var(--fs-104));\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tightest);\n  color: var(--fg-1);\n}\n\n.t-display, h1, :where(h1) {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: clamp(40px, 5vw, var(--fs-64));\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tighter);\n  color: var(--fg-1);\n}\n\n.t-h1 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-48);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tighter);\n  color: var(--fg-1);\n}\n\n.t-h2, h2, :where(h2) {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-32);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n  color: var(--fg-1);\n}\n\n.t-h3, h3, :where(h3) {\n  font-family: var(--font-body);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-24);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n  color: var(--fg-1);\n}\n\n.t-h4, h4, :where(h4) {\n  font-family: var(--font-body);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-18);\n  line-height: var(--lh-snug);\n  color: var(--fg-1);\n}\n\n.t-body, p, :where(p) {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-16);\n  line-height: var(--lh-base);\n  color: var(--fg-1);\n}\n\n.t-body-sm {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-14);\n  line-height: var(--lh-base);\n  color: var(--fg-2);\n}\n\n.t-caption {\n  font-family: var(--font-body);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-12);\n  line-height: var(--lh-base);\n  color: var(--fg-3);\n}\n\n.t-eyebrow {\n  font-family: var(--font-body);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-12);\n  line-height: 1;\n  letter-spacing: var(--ls-widest);\n  text-transform: uppercase;\n  color: var(--fg-2);\n}\n\n.t-label {\n  font-family: var(--font-body);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-13);\n  line-height: 1;\n  color: var(--fg-2);\n}\n\n.t-button {\n  font-family: var(--font-body);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-15);\n  line-height: 1;\n  letter-spacing: var(--ls-tight);\n}\n\n.t-mono {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-14);\n  line-height: 1;\n  letter-spacing: var(--ls-normal);\n  font-variant-numeric: tabular-nums;\n}\n\n.t-time {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-18);\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n  color: var(--fg-1);\n}\n\n/* Link styles */\na {\n  color: var(--fg-link);\n  text-decoration-color: rgba(190,0,0,.35);\n  text-underline-offset: 2px;\n  transition: opacity var(--dur-micro) var(--ease-orbit);\n}\na:hover { opacity: .82; }\n\n/* Selection */\n::selection {\n  background: var(--hostliday-red-500);\n  color: var(--neutral-0);\n}\n\n/* =========================================================\n   UTILITY HELPERS\n   ========================================================= */\n.surface-card {\n  background: var(--bg-surface);\n  border-radius: var(--r-card);\n  box-shadow: var(--shadow-card);\n}\n.surface-flat {\n  background: var(--bg-surface);\n  border: 1px solid var(--border-1);\n  border-radius: var(--r-card);\n}\n.brand-gradient-bg {\n  background: var(--hostliday-gradient);\n  color: var(--fg-on-brand);\n}\n\n/* Ambient breathe for live elements */\n@keyframes orbit-breathe {\n  0%, 100% { transform: scale(1);   opacity: .9; }\n  50%      { transform: scale(1.18); opacity: .35; }\n}\n.orbit-breathe {\n  animation: orbit-breathe var(--dur-breathe) var(--ease-orbit) infinite;\n}\n\n/* Reduced motion */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.001ms !important;\n    transition-duration: 0.001ms !important;\n  }\n}\n<\u002Fstyle>\n\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: var(--neutral-100); color: var(--fg-1); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }\n  .wrap { max-width: 1080px; margin: 0 auto; padding: 56px 32px 120px; }\n  header { display: flex; align-items: center; gap: 16px; margin-bottom: 56px; }\n  header img { height: 28px; }\n  header .crumb { font: 600 12px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }\n  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 6vw, 72px); letter-spacing: -0.025em; line-height: 1.05; margin: 0 0 18px; max-width: 880px; }\n  .lead { font-size: 18px; line-height: 1.55; color: var(--fg-2); max-width: 720px; margin: 0 0 12px; }\n  .lead b { color: var(--fg-1); font-weight: 600; }\n  .meta { font: 500 12px var(--font-mono); letter-spacing: .04em; color: var(--fg-3); margin-top: 8px; }\n\n  .section { margin-top: 64px; }\n  .section h2 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }\n  .section .desc { font-size: 14px; color: var(--fg-3); margin-bottom: 20px; }\n\n  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }\n  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }\n\n  .card { display: block; padding: 22px 24px; background: var(--bg-surface); border-radius: 12px; box-shadow: var(--shadow-card); text-decoration: none; color: inherit; transition: transform 220ms var(--ease-orbit), box-shadow 220ms var(--ease-orbit); border-left: 3px solid transparent; }\n  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop); }\n  .card.explore { border-left-color: var(--hostliday-red-500); }\n  .card.compose { border-left-color: var(--status-confirmed); }\n  .card.navigate { border-left-color: var(--status-live); }\n  .card.recover { border-left-color: var(--status-held); }\n  .eye { font: 700 11px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); }\n  .card.explore .eye { color: var(--hostliday-red-700); }\n  .card.compose .eye { color: var(--status-confirmed); }\n  .card.navigate .eye { color: var(--status-live); }\n  .card.recover .eye { color: #8C5E18; }\n  .name { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.015em; margin: 6px 0 6px; }\n  .card p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--fg-2); }\n  .arrow { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; font-weight: 600; font-size: 13px; color: var(--fg-1); }\n\n  .doclinks { display: flex; gap: 14px; flex-wrap: wrap; }\n  .doc { padding: 10px 14px; background: var(--bg-surface); border: 1px solid var(--border-1); border-radius: 8px; text-decoration: none; color: var(--fg-1); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }\n  .doc:hover { border-color: var(--neutral-700); }\n  .doc .k { color: var(--fg-3); font-family: var(--font-mono); font-size: 12px; }\n\n  .pricks { display: flex; gap: 8px; align-items: center; margin-top: 32px; flex-wrap: wrap; }\n  .pricks .swatch { width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--border-1); }\n  .pricks .lbl { font: 500 11px var(--font-mono); letter-spacing: .04em; color: var(--fg-3); margin-left: 8px; margin-right: 4px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n  <header>\n    <img src=\"44135d59-443c-4dad-9800-9d2675ced81f\" alt=\"Hostliday\">\n    <span class=\"crumb\">Design System · Orbit<\u002Fspan>\n  <\u002Fheader>\n\n  <h1>The trip-coordination layer for Hostliday.<\u002Fh1>\n  <p class=\"lead\">Hostliday Orbit is a single design system with <b>four product surfaces<\u002Fb> — Explore, Compose, Navigate, Recover — each with its own register but sharing one set of color, type, and motion tokens.<\u002Fp>\n  <p class=\"meta\">Hostliday red · Montserrat + Inter · 4-surface system<\u002Fp>\n\n  <div class=\"pricks\">\n    <span class=\"lbl\">Palette<\u002Fspan>\n    <span class=\"swatch\" style=\"background:#DA0000\"><\u002Fspan>\n    <span class=\"swatch\" style=\"background:#BE0000\"><\u002Fspan>\n    <span class=\"swatch\" style=\"background:#810000\"><\u002Fspan>\n    <span class=\"swatch\" style=\"background:#000000\"><\u002Fspan>\n    <span class=\"swatch\" style=\"background:#A3A2A2\"><\u002Fspan>\n    <span class=\"swatch\" style=\"background:#E1DFDD\"><\u002Fspan>\n    <span class=\"swatch\" style=\"background:#FAF8F6\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <section class=\"section\">\n    <h2>Four surfaces<\u002Fh2>\n    <div class=\"desc\">Each is a self-contained React + Babel page using the shared tokens.<\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"card explore\">\n        <div class=\"eye\">Explore<\u002Fdiv>\n        <div class=\"name\">Research &amp; save<\u002Fdiv>\n        <p>Warm photo-led discovery. Save anything to a trip board. Hero gradient and large display type.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card compose\">\n        <div class=\"eye\">Compose<\u002Fdiv>\n        <div class=\"name\">Plan &amp; build<\u002Fdiv>\n        <p>Day-by-day timeline with Orbit chat alongside. Slot in existing bookings, compare candidates, hold options.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card navigate\">\n        <div class=\"eye\">Navigate<\u002Fdiv>\n        <div class=\"name\">Live trip<\u002Fdiv>\n        <p>Dark, map-first chrome. Translucent glass panels, mono times, breathing live dot. Terse, time-stamped voice.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card recover\">\n        <div class=\"eye\">Recover<\u002Fdiv>\n        <div class=\"name\">When plans change<\u002Fdiv>\n        <p>Incident view: what broke, what Orbit's already done, three held options, one tap to switch. Humans on call.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"section\">\n    <h2>Foundations<\u002Fh2>\n    <div class=\"desc\">Single source of truth: <code style=\"font-family:var(--font-mono);font-size:12px;background:var(--neutral-100);padding:2px 6px;border-radius:4px;\">colors_and_type.css<\u002Fcode>. All tokens are CSS custom properties.<\u002Fdiv>\n    <div class=\"pricks\">\n      <span class=\"lbl\">Status<\u002Fspan>\n      <span class=\"swatch\" style=\"background:#1F7A4D\" title=\"Confirmed\"><\u002Fspan>\n      <span class=\"swatch\" style=\"background:#B6822E\" title=\"Held\"><\u002Fspan>\n      <span class=\"swatch\" style=\"background:#BE0000\" title=\"Critical\"><\u002Fspan>\n      <span class=\"swatch\" style=\"background:#2E5C8A\" title=\"Live\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:var(--fg-3);margin-top:32px;line-height:1.55;max-width:680px;\">\n      This is the standalone overview. The four working surface prototypes live in the project — open the project to interact with them.\n    <\u002Fp>\n  <\u002Fsection>\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
