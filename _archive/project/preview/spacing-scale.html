<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{background:var(--hostliday-red-100);border-left:2px solid var(--hostliday-red-500);width:100%}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="item"><div class="box" style="height:4px"></div><div class="lbl">sp-1</div><div class="px">4</div></div>
    <div class="item"><div class="box" style="height:8px"></div><div class="lbl">sp-2</div><div class="px">8</div></div>
    <div class="item"><div class="box" style="height:12px"></div><div class="lbl">sp-3</div><div class="px">12</div></div>
    <div class="item"><div class="box" style="height:16px"></div><div class="lbl">sp-4</div><div class="px">16</div></div>
    <div class="item"><div class="box" style="height:24px"></div><div class="lbl">sp-6</div><div class="px">24</div></div>
    <div class="item"><div class="box" style="height:32px"></div><div class="lbl">sp-8</div><div class="px">32</div></div>
    <div class="item"><div class="box" style="height:40px"></div><div class="lbl">sp-10</div><div class="px">40</div></div>
    <div class="item"><div class="box" style="height:56px"></div><div class="lbl">sp-14</div><div class="px">56</div></div>
    <div class="item"><div class="box" style="height:80px"></div><div class="lbl">sp-20</div><div class="px">80</div></div>
    <div class="item"><div class="box" style="height:120px"></div><div class="lbl">sp-30</div><div class="px">120</div></div>
  </div>
</div></body></html>
