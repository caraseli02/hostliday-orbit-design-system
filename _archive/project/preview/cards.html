<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .place{position:relative;border-radius:12px;overflow:hidden;height:200px;background:#3F3E3D}
  .place img{width:100%;height:100%;object-fit:cover;display:block}
  .place .pg{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%, rgba(0,0,0,.65) 100%)}
  .place .meta{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;font-family:var(--font-body)}
  .place .ttl{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.01em;line-height:1.1}
  .place .sub{font-size:13px;opacity:.85;margin-top:3px}
  .place .pin{position:absolute;top:12px;left:12px;width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
  .place .pin svg{width:16px;height:16px;color:#BE0000}
  .stay{background:var(--bg-surface);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.10);padding:14px;display:flex;gap:12px}
  .stay .thumb{width:72px;height:72px;border-radius:8px;background:#C9C6C2;flex:0 0 72px}
  .stay .body{flex:1;display:flex;flex-direction:column;gap:3px}
  .stay .name{font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--fg-1)}
  .stay .loc{font-size:12px;color:var(--fg-3);font-family:var(--font-body)}
  .stay .price{margin-top:auto;font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--fg-1)}
</style></head>
<body><div class="card" style="background:var(--neutral-100)">
  <div class="grid">
    <div class="place">
      <img src="../assets/imagery/mountain-bedroom-hero.png" alt="">
      <div class="pg"></div>
      <div class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-7.5-7-12a7 7 0 1 1 14 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></div>
      <div class="meta"><div class="ttl">Casa do Vale</div><div class="sub">Douro Valley · stays from €180</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="stay">
        <div class="thumb" style="background:#A3A2A2"></div>
        <div class="body">
          <div class="name">Quinta da Aveleda</div>
          <div class="loc">Penafiel · 1h drive</div>
          <div class="price">€220 / night</div>
        </div>
      </div>
      <div class="stay">
        <div class="thumb" style="background:#807F7E"></div>
        <div class="body">
          <div class="name">Hotel Tivoli Lagos</div>
          <div class="loc">Algarve · pool · sea-view</div>
          <div class="price">€310 / night</div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
