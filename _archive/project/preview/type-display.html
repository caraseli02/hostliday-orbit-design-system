<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .stack > * + * { margin-top: 14px }
  .row{display:flex;align-items:baseline;gap:18px}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);min-width:78px}
  .specimen{color:var(--fg-1);font-family:var(--font-display);font-weight:900;letter-spacing:-0.03em;line-height:1}
</style></head>
<body><div class="card stack">
  <div class="row"><span class="meta">Hero · 104</span><span class="specimen" style="font-size:64px">€420</span></div>
  <div class="row"><span class="meta">Display · 64</span><span class="specimen" style="font-size:48px;font-weight:700;letter-spacing:-0.02em">Hold their shape.</span></div>
  <div class="row"><span class="meta">H1 · 48</span><span class="specimen" style="font-size:36px;font-weight:700;letter-spacing:-0.02em">Douro Valley</span></div>
  <div class="row"><span class="meta">H2 · 32</span><span class="specimen" style="font-size:26px;font-weight:700;letter-spacing:-0.01em">Saved this week</span></div>
</div></body></html>
