<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .row{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
  .sw{aspect-ratio:1/1.5;border-radius:6px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border:1px solid rgba(0,0,0,.06);font-family:var(--font-mono);font-size:9px}
  .sw .n{font-weight:600;font-family:var(--font-body);letter-spacing:.04em;text-transform:uppercase;font-size:9px}
  .sw .h{font-size:9px;opacity:.7}
  .lt{color:#0E0E0E}
  .dk{color:#fff}
</style></head>
<body><div class="card">
  <div class="row">
    <div class="sw lt" style="background:#FFFFFF;border-color:#E1DFDD"><div class="n">0</div><div class="h">FFFFFF</div></div>
    <div class="sw lt" style="background:#FAF8F6"><div class="n">50</div><div class="h">FAF8F6</div></div>
    <div class="sw lt" style="background:#F4F1ED"><div class="n">100</div><div class="h">F4F1ED</div></div>
    <div class="sw lt" style="background:#ECE8E3"><div class="n">150</div><div class="h">ECE8E3</div></div>
    <div class="sw lt" style="background:#E1DFDD"><div class="n">200</div><div class="h">E1DFDD</div></div>
    <div class="sw lt" style="background:#C9C6C2"><div class="n">300</div><div class="h">C9C6C2</div></div>
    <div class="sw lt" style="background:#A3A2A2"><div class="n">400</div><div class="h">A3A2A2</div></div>
    <div class="sw dk" style="background:#807F7E"><div class="n">500</div><div class="h">807F7E</div></div>
    <div class="sw dk" style="background:#3F3E3D"><div class="n">700</div><div class="h">3F3E3D</div></div>
    <div class="sw dk" style="background:#232221"><div class="n">800</div><div class="h">232221</div></div>
    <div class="sw dk" style="background:#000000"><div class="n">1000</div><div class="h">000000</div></div>
  </div>
</div></body></html>
