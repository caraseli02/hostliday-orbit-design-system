<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:6px 0 16px}
  .item{display:flex;flex-direction:column;align-items:center;gap:14px}
  .box{width:100%;height:88px;background:var(--bg-surface);border-radius:12px}
  .flat{box-shadow:0 0 0 1px var(--border-1)}
  .card-sh{box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.10)}
  .pop{box-shadow:0 8px 16px -4px rgba(0,0,0,.08), 0 24px 48px -16px rgba(0,0,0,.18)}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}
</style></head>
<body><div class="card" style="background:var(--neutral-100)">
  <div class="row">
    <div class="item"><div class="box flat"></div><div class="lbl">--shadow-flat</div></div>
    <div class="item"><div class="box card-sh"></div><div class="lbl">--shadow-card</div></div>
    <div class="item"><div class="box pop"></div><div class="lbl">--shadow-pop</div></div>
  </div>
</div></body></html>
