<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .stack > * + * { margin-top: 12px }
  .row{display:flex;align-items:baseline;gap:18px}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);min-width:78px}
  .specimen{color:var(--fg-1);font-family:var(--font-body)}
  .eyebrow{font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
  .label{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--fg-2)}
  .caption{font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--fg-3)}
</style></head>
<body><div class="card stack">
  <div class="row"><span class="meta">H3 · 24</span><span class="specimen" style="font-size:22px;font-weight:600;letter-spacing:-0.01em">Cabins above the cloud line</span></div>
  <div class="row"><span class="meta">H4 · 18</span><span class="specimen" style="font-size:17px;font-weight:600">Casa do Vale</span></div>
  <div class="row"><span class="meta">Body · 16</span><span class="specimen" style="font-size:15px;line-height:1.5">Quiet stays, ten minutes from the river. Late check-in available.</span></div>
  <div class="row"><span class="meta">Body sm · 14</span><span class="specimen" style="font-size:13px;color:var(--fg-2)">Saved 3 days ago · 2 nights</span></div>
  <div class="row"><span class="meta">Label · 13</span><span class="label">Check-in</span></div>
  <div class="row"><span class="meta">Caption · 12</span><span class="caption">Free cancellation until 24 Aug</span></div>
  <div class="row"><span class="meta">Eyebrow · 12</span><span class="eyebrow">Curated for you</span></div>
</div></body></html>
