<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:100%;height:64px;background:var(--bg-surface);border:1px solid var(--border-1)}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style></head>
<body><div class="card" style="background:var(--neutral-100)">
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="lbl">r-chip</div><div class="px">4px</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="lbl">r-input</div><div class="px">8px</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="lbl">r-card</div><div class="px">12px</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="lbl">r-sheet</div><div class="px">20px</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="lbl">r-pill</div><div class="px">999</div></div>
  </div>
</div></body></html>
