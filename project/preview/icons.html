<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .row{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
  .icon{aspect-ratio:1;border:1px solid var(--border-1);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
  .icon svg{width:22px;height:22px;color:var(--fg-1)}
  .icon .n{font-family:var(--font-mono);font-size:9px;color:var(--fg-3)}
</style></head>
<body><div class="card">
  <div class="row">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-7.5-7-12a7 7 0 1 1 14 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><div class="n">map-pin</div></div>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><div class="n">search</div></div>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 14-7 7-7-7"/><path d="M19 14a7 7 0 0 0-14 0"/><path d="M12 4v10"/></svg><div class="n">plane</div></div>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg><div class="n">card</div></div>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14V8a3 3 0 0 0-3-3H8a3 3 0 0 0-3 3v6"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 14v3M17 14v3"/></svg><div class="n">bed</div></div>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6"/><circle cx="12" cy="13" r="9"/><path d="m9 13 3 3 5-6"/></svg><div class="n">check</div></div>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><div class="n">save</div></div>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div class="n">clock</div></div>
  </div>
  <div style="margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">Lucide · 1.5px stroke · 24px grid · inherits currentColor</div>
</div></body></html>
