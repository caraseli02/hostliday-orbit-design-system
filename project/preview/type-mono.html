<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .pane{border:1px solid var(--border-1);border-radius:10px;padding:14px}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase}
  .time{font-family:var(--font-mono);font-weight:600;font-size:22px;color:var(--fg-1);font-variant-numeric:tabular-nums;line-height:1}
  .row{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:13px;color:var(--fg-1);font-variant-numeric:tabular-nums;padding:4px 0}
  .row + .row{border-top:1px dashed var(--border-1)}
  .row .v{color:var(--fg-2)}
  .plate{font-family:var(--font-mono);font-weight:700;font-size:18px;color:var(--fg-1);letter-spacing:.04em}
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="pane">
      <div class="meta">Time</div>
      <div class="time">14:08</div>
      <div class="row" style="margin-top:8px"><span>Platform</span><span class="v">6</span></div>
      <div class="row"><span>Coach</span><span class="v">B · 23A</span></div>
    </div>
    <div class="pane">
      <div class="meta">Reference</div>
      <div class="plate">22-AB-94</div>
      <div class="row" style="margin-top:8px"><span>Gate</span><span class="v">D24</span></div>
      <div class="row"><span>PNR</span><span class="v">QH3X8R</span></div>
    </div>
    <div class="pane">
      <div class="meta">Numerals</div>
      <div class="time">€1,240</div>
      <div class="row" style="margin-top:8px"><span>0123456789</span><span class="v">tabular</span></div>
      <div class="row"><span>JetBrains Mono</span><span class="v">600</span></div>
    </div>
  </div>
</div></body></html>
