<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:0;background:transparent}
  .logos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{border:1px solid var(--border-1);border-radius:12px;padding:18px;display:flex;align-items:center;justify-content:center;height:120px}
  .dark{background:#0E0E0E;border-color:#0E0E0E}
  .grad{background:var(--hostliday-gradient-120)}
</style></head>
<body><div class="card">
  <div class="logos">
    <div class="panel"><img src="../assets/logos/hostliday-wordmark.svg" style="height:48px"></div>
    <div class="panel dark"><img src="../assets/logos/hostliday-wordmark-white.svg" style="height:48px"></div>
    <div class="panel" style="height:120px;justify-content:flex-start;gap:18px;padding:18px 24px"><img src="../assets/logos/hostliday-isotype.svg" style="height:64px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);line-height:1.5">Isotype<br>96 × 96</div></div>
    <div class="panel" style="height:120px;justify-content:flex-start;gap:18px;padding:18px 24px"><img src="../assets/logos/hostliday-app-icon.svg" style="height:80px;border-radius:18px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);line-height:1.5">App icon<br>180 × 180</div></div>
  </div>
</div></body></html>
